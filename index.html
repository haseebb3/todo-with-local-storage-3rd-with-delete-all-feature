<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
  <h3 class="bg-warning text-center">Todo with Local Storage 3rd</h3>
  <section>
    <div class="container">
      <div class="row">
        <div class="col-md-8 offset-md-2 mt-4">
          <form id="todoForm">
            <div class="form-group d-flex justify-content-between">
              <input required type="text" class="form-control p-4 mr-3 form-control" id="todoInput" placeholder="Enter todo">
              <button type="submit" id="addTodoBtn" class="btn btn-outline-primary btn-sm col-3">Add Todo</button>
              <button type="button" id="updateTodoBtn" class="btn btn-outline-primary btn-sm col-3 d-none">Update Todo</button>
            </div>
          </form>
        </div>

        <div class="col-md-8 offset-md-2 mt-3">
          <button class="btn btn-sm btn-danger" id="deleteAllBtn">Delete All Todos</button>
          <ul class="list-group mt-3" id="todoList">
            <!-- <li class="list-group-item d-flex justify-content-between align-items-center">
              <strong>Html</strong>
              <div>
                <button class="btn btn-sm btn-warning mr-2">Edit</button>
                <button class="btn btn-sm btn-danger">Delete</button>
              </div>
            </li> -->
          </ul>
        </div>
      </div>

    </div>
  </section>



  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./assets/js/app.js"></script>
</body>

</html>
